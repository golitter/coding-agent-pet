name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend (Prettier + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/cross-platform/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint src

  lint-rust:
    name: Lint Rust (fmt + clippy + check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/cross-platform/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/cross-platform/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check

  lint-scripts:
    name: Lint Scripts (shellcheck + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck \
            desktop/cross-platform/hooks/*.sh \
            desktop/cross-platform/setup.sh \
            desktop/cross-platform/setup-hooks.sh \
            desktop/cross-platform/build-and-run.sh
      - uses: astral-sh/setup-uv@v3
      - name: ruff
        run: uvx ruff check desktop/cross-platform/hooks/scripts

  lint-autofix:
    name: Auto-Fix Lint Formatting
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/cross-platform/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: desktop/cross-platform
        run: npm ci
      - name: Fix ESLint and Prettier
        working-directory: desktop/cross-platform
        run: npm run lint:fix
      - name: Fix Rust formatting
        working-directory: desktop/cross-platform/src-tauri
        run: cargo fmt
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix lint formatting"
          file_pattern: "desktop/cross-platform/**"
